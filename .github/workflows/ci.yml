# Job names are the required status checks of the `main` ruleset (.github/rulesets/main.json).
# Rename a job only together with that file and the live ruleset, or merges into main will block.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  PYTHON_VERSION: "3.14"
  # liboqs for the lab extra (DESIGN §13, IMPLEMENTATION_PLAN M0.10). Tag and its commit are both
  # pinned; bump them together with liboqs-python.
  LIBOQS_TAG: "0.16.0"
  LIBOQS_COMMIT: "5a1a854b0dc9f2141bdc771c555ee60c37950183"
  # ProVerif for the formal model (formal/README.md). The SHA-256 is the one in opam-repository's
  # packages/proverif/proverif.2.05/opam.
  PROVERIF_VERSION: "2.05"
  PROVERIF_SHA256: "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4"

jobs:
  checks:
    name: Lint, types, layers, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pip-audit

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest

  liboqs:
    name: liboqs ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      OQS_PREFIX: ${{ github.workspace }}/_oqs
    steps:
      - uses: actions/checkout@v7
      - name: Restore liboqs build
        id: cache
        uses: actions/cache@v6
        with:
          path: _oqs
          key: liboqs-${{ env.LIBOQS_COMMIT }}-${{ runner.os }}-${{ runner.arch }}-v2
      - name: Check out liboqs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: open-quantum-safe/liboqs
          ref: ${{ env.LIBOQS_TAG }}
          path: _liboqs-src
      - name: Verify the tag's commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: test "$(git -C _liboqs-src rev-parse HEAD)" = "$LIBOQS_COMMIT"
      - name: Build liboqs
        if: steps.cache.outputs.cache-hit != 'true'
        # Shared library only; portable CPU dispatch (OQS_DIST_BUILD); no OpenSSL dependency so
        # the bundle is self-contained.
        # MSVC: liboqs 0.16.0's SLH-DSA tests `__BYTE_ORDER__ == __ORDER_BIG_ENDIAN__`; MSVC
        # defines neither, so the test is 0 == 0 and SHA-2 takes the big-endian path. Define the
        # GCC macros (via CFLAGS, which keeps MSVC's default flags). VERIFIED_FACTS has the details.
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra+=(-DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=TRUE)
            export CFLAGS="-D__ORDER_LITTLE_ENDIAN__=1234 -D__ORDER_BIG_ENDIAN__=4321 -D__BYTE_ORDER__=1234"
          fi
          cmake -S _liboqs-src -B _liboqs-build \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_DIST_BUILD=ON \
            -DOQS_USE_OPENSSL=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$OQS_PREFIX" "${extra[@]}"
          cmake --build _liboqs-build --config Release --parallel 4
          cmake --install _liboqs-build --config Release
      - name: Show the built library
        run: ls -la "$OQS_PREFIX"/lib* "$OQS_PREFIX"/bin 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: liboqs-${{ env.LIBOQS_TAG }}-${{ runner.os }}-${{ runner.arch }}
          path: _oqs
          retention-days: 30
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Lab algorithms load from the bundle
        env:
          OQS_INSTALL_PATH: ${{ env.OQS_PREFIX }}
          QRP2P_REQUIRE_LIBOQS: "1"
        run: uv run pytest -m liboqs tests/lab

  formal:
    name: Formal model (ProVerif)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Restore ProVerif
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.local/proverif
          key: proverif-${{ env.PROVERIF_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build ProVerif
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml-nox ocaml-findlib
          curl -fsSL -o proverif.tar.gz "https://proverif.inria.fr/proverif${PROVERIF_VERSION}.tar.gz"
          echo "${PROVERIF_SHA256}  proverif.tar.gz" | sha256sum -c -
          tar xzf proverif.tar.gz
          cd "proverif${PROVERIF_VERSION}"
          # The interactive simulator needs lablgtk2, which Ubuntu no longer ships; the verifier
          # itself builds without it.
          ./build || true
          test -x proverif
          mkdir -p ~/.local/proverif
          cp proverif ~/.local/proverif/
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify the models
        run: >-
          uv run --no-project python formal/verify.py
          --proverif ~/.local/proverif/proverif --log-dir "$RUNNER_TEMP/proverif"
      - name: Upload ProVerif output (attack traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proverif-output
          path: ${{ runner.temp }}/proverif
          retention-days: 30
