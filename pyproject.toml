[project]
name = "qrp2p"
version = "2.0.0.dev0"
description = "LAN messenger with a hybrid post-quantum channel and a learning layer that lets you watch and attack it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DivinityQQ", email = "divinityqq@gmail.com" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
# Only what is imported; exact versions are pinned in uv.lock. The headless node and `qrp2p-cli`
# need nothing else. PySide6 joins in M3 as the `gui` extra, so the CLI runs without Qt (DESIGN §13).
dependencies = [
    "cryptography>=50.0.1",
    "filelock>=4.0.4",
    "ifaddr>=0.2.0",
    "keyring>=25.7.0",
    "msgspec>=0.21.1",
    "platformdirs>=4.12.0",
    "zeroconf>=0.151.3",
]

[project.optional-dependencies]
# Lab-only algorithms (DESIGN §11.9). Never imported directly: qrp2p.lab.oqs_loader checks for a
# bundled liboqs first, because liboqs-python otherwise builds liboqs at import time.
lab = ["liboqs-python>=0.16.0.1"]

[project.scripts]
qrp2p-cli = "qrp2p.cli.app:main"

[project.urls]
Repository = "https://github.com/DivinityQQ/quantum-resistant-p2p"

[dependency-groups]
dev = [
    "dilithium-py>=1.4.0",
    "hypothesis>=6.168.2",
    "import-linter>=2.15",
    "kyber-py>=1.2.0",
    "mutmut>=3.8.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

# --- pytest -------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "liboqs: needs a bundled liboqs (OQS_INSTALL_PATH); skipped when it is absent",
]

# --- ruff ---------------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["docs/v2/research"]  # frozen research spikes, kept exactly as run

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # no per-file copyright headers; the licence is in LICENSE
    "D105",    # magic methods are self-describing
    "D107",    # __init__ is documented on the class
    "E501",    # the formatter bounds code lines; long lines left are verbatim spec excerpts
    "TC001",   # annotations are deferred in 3.14 (PEP 649); plain imports are simpler
    "TC002",
    "TC003",
    "TD002",   # TODOs need no author
    "TD003",   # TODOs need no issue link
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 7  # Expand-Label(h, S, label, ctx, L, name) mirrors the spec's signature

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",        # test names are the documentation
    "S101",     # assert is how pytest works
    "PLR2004",  # sizes from the spec are clearer inline than as named constants
    "SLF001",   # tests may look at private state
    "FBT",      # boolean parameters in test helpers are fine
    "PT017",    # fuzz tests assert on the reason of whatever error they get
    "S105",     # test passwords are not secrets
    "S106",
    "S107",
]
"formal/verify.py" = [
    "INP001",   # a standalone script, not a package
    "T201",     # its output is the report
]
"src/qrp2p/cli/commands.py" = [
    "TRY003",   # a UsageError's message is the text the user sees
    "EM101",
    "EM102",
]
"tests/mutation_gate.py" = ["T201"]  # its output is the report
"tools/**" = [
    "INP001",   # standalone scripts, not a package
    "T201",     # their output is the report
    "S603",     # they run the project's own tools, with fixed arguments
    "S607",     # tools are found on PATH, which `uv run` sets to the project's environment
]

[tool.ruff.format]
docstring-code-format = true

# --- pyright ------------------------------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["docs/v2/research"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"

# --- import-linter (DESIGN §12.2) ---------------------------------------------------------------

[tool.importlinter]
root_package = "qrp2p"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports nothing from services, lab or ui"
type = "forbidden"
source_modules = ["qrp2p.core"]
forbidden_modules = ["qrp2p.services", "qrp2p.lab", "qrp2p.ui"]

[[tool.importlinter.contracts]]
name = "core uses only stdlib, cryptography and msgspec (DESIGN §12.1)"
type = "forbidden"
source_modules = ["qrp2p.core"]
forbidden_modules = ["oqs", "PySide6", "zeroconf", "ifaddr", "platformdirs", "keyring", "filelock"]

[[tool.importlinter.contracts]]
name = "services never import the weakened engines or liboqs"
type = "forbidden"
source_modules = ["qrp2p.services"]
forbidden_modules = ["qrp2p.lab.weakened", "oqs"]

[[tool.importlinter.contracts]]
name = "ui may read core.trace and core.wire but never drives core"
type = "forbidden"
source_modules = ["qrp2p.ui"]
forbidden_modules = ["qrp2p.core"]
ignore_imports = ["qrp2p.ui.** -> qrp2p.core.trace", "qrp2p.ui.** -> qrp2p.core.wire"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "the CLI is a front end: it drives the services, never core or lab directly"
type = "forbidden"
source_modules = ["qrp2p.cli"]
forbidden_modules = ["qrp2p.core", "qrp2p.lab", "qrp2p.ui", "PySide6"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services and the CLI never import Qt, so the node runs headless"
type = "forbidden"
source_modules = ["qrp2p.services", "qrp2p.cli"]
forbidden_modules = ["PySide6", "qrp2p.ui"]

# --- mutmut (DESIGN §15 row 4) -------------------------------------------------------------------

[tool.mutmut]
paths_to_mutate = ["src/qrp2p/core/"]
tests_dir = ["tests/"]
also_copy = ["src/qrp2p/__init__.py", "src/qrp2p/py.typed", "src/qrp2p/lab/", "src/qrp2p/services/", "src/qrp2p/ui/", "src/qrp2p/cli/"]
